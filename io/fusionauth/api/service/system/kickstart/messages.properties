# Kickstart specific validation outside an API

# API key validation
[tooLong]apiKeys.key=The [apiKeys.key] property cannot be longer than %d characters.
[tooShort]apiKeys.key=The [apiKeys.key] property must be at least %d characters.
[couldNotConvert]apiKeys.ipAccessControlListId=The [apiKeys.ipAccessControlListId] property must be a valid UUID.
[invalid]apiKeys.ipAccessControlListId=The [apiKeys.ipAccessControlListId] property is invalid. The IP access control list with Id [%s] does not exist.
[invalidScope]apiKeys.permissions=Endpoint [%s] requires a globally scoped API key, but this API key has a tenant selected. Remove permissions to this endpoint or remove the tenant.
[invalidUri]apiKeys.permissions=Endpoint [%s] is not a valid FusionAuth API endpoint.

